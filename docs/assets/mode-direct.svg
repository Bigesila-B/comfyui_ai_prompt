<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">直连自动生成接线图</title><desc id="desc">图像与 CLIP 接入生成器，Queue 时调用模型并输出文本和条件。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#506784"/></marker><style>.box{fill:#f7f9fc;stroke:#506784;stroke-width:3}.head{fill:#315b8a}.t{font:23px sans-serif;fill:#17253a}.h{font:bold 25px sans-serif;fill:white}.s{font:18px sans-serif;fill:#4a5d73}.line{stroke:#506784;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="430" rx="24" fill="#eef3f8"/>
  <rect class="box" x="40" y="65" width="215" height="105" rx="15"/><text class="t" x="147" y="112" text-anchor="middle">加载图像</text><text class="s" x="147" y="144" text-anchor="middle">IMAGE</text>
  <rect class="box" x="40" y="260" width="215" height="105" rx="15"/><text class="t" x="147" y="307" text-anchor="middle">模型加载器</text><text class="s" x="147" y="339" text-anchor="middle">CLIP</text>
  <line class="line" x1="270" y1="117" x2="390" y2="155"/><line class="line" x1="270" y1="312" x2="390" y2="270"/>
  <rect class="box" x="410" y="55" width="360" height="320" rx="16"/><path class="head" d="M426 55h328a16 16 0 0116 16v42H410V71a16 16 0 0116-16z"/><text class="h" x="590" y="93" text-anchor="middle">AI 提示词生成器</text><text class="s" x="445" y="150">direct_mode = true</text><text class="s" x="445" y="183">vision = true</text><text class="s" x="445" y="216">encode_clip = true</text><rect x="460" y="250" width="260" height="54" rx="10" fill="#2e79bd"/><text x="590" y="284" text-anchor="middle" font-family="sans-serif" font-size="21" fill="white">Queue：每次调用 API</text><text class="s" x="590" y="341" text-anchor="middle">忽略旧 result，生成新结果</text>
  <line class="line" x1="785" y1="155" x2="905" y2="125"/><text class="s" x="840" y="112" text-anchor="middle">response</text><line class="line" x1="785" y1="275" x2="905" y2="305"/><text class="s" x="840" y="328" text-anchor="middle">conditioning</text>
  <rect class="box" x="925" y="70" width="230" height="110" rx="15"/><text class="t" x="1040" y="119" text-anchor="middle">文本下游</text><text class="s" x="1040" y="151" text-anchor="middle">STRING</text>
  <rect class="box" x="925" y="250" width="230" height="110" rx="15"/><text class="t" x="1040" y="299" text-anchor="middle">采样器</text><text class="s" x="1040" y="331" text-anchor="middle">CONDITIONING</text>
</svg>
